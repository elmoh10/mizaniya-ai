name: Mizaniya AI Staging CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: npm run build

      - name: Verify Docker Build
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            -t mizaniya-app:test .

  deploy-staging:
    name: Deploy Staging via Terraform
    needs: validate-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    env:
      GCP_PROJECT_ID: mizaniya-ai-staging
      GCP_REGION: europe-west3
      TFSTATE_BUCKET: mizaniya-ai-staging-tfstate
      ARTIFACT_REPO: mizaniya-repo
      IMAGE_NAME: mizaniya-app
      CLOUD_RUN_SERVICE: mizaniya-app-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify Bootstrap Resources
        run: |
          gcloud storage buckets describe "gs://${{ env.TFSTATE_BUCKET }}" \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null || {
              echo "::error::Missing Terraform state bucket: ${{ env.TFSTATE_BUCKET }}."
              exit 1
            }

          gcloud artifacts repositories describe "${{ env.ARTIFACT_REPO }}" \
            --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null || {
              echo "::error::Missing Artifact Registry repository: ${{ env.ARTIFACT_REPO }}."
              exit 1
            }

          gcloud secrets describe gemini-api-key \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null || {
              echo "::error::Missing Secret Manager secret: gemini-api-key."
              exit 1
            }

          ENABLED_VERSIONS=$(gcloud secrets versions list gemini-api-key \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --filter="state=ENABLED" \
            --format="value(name)")

          if [ -z "$ENABLED_VERSIONS" ]; then
            echo "::error::gemini-api-key exists but has no enabled secret version."
            exit 1
          fi

          echo "Bootstrap resources verified successfully."

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker \
            "${{ env.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Build & Push Immutable Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            -t "$IMAGE_URI" .

          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5

      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TFSTATE_BUCKET }}" \
            -backend-config="prefix=staging"

      - name: Import Existing Cloud Run Service
        working-directory: ./infrastructure/terraform
        run: |
          if terraform state show google_cloud_run_v2_service.mizaniya_app >/dev/null 2>&1; then
            echo "Cloud Run service already exists in Terraform state."
            echo "No import required."
          else
            if gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
              --region="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then

              echo "Existing Cloud Run service detected."
              echo "Importing service into Terraform state..."

              terraform import \
                -var-file="environments/staging.tfvars" \
                -var="container_image=${{ env.IMAGE_URI }}" \
                google_cloud_run_v2_service.mizaniya_app \
                "projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/services/${{ env.CLOUD_RUN_SERVICE }}"

              echo "Cloud Run import completed successfully."
            else
              echo "Cloud Run service does not currently exist."
              echo "Terraform will create it during apply."
            fi
          fi

      - name: Terraform Format
        working-directory: ./infrastructure/terraform
        run: terraform fmt -recursive

      - name: Terraform Validate
        working-directory: ./infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infrastructure/terraform
        run: |
          terraform plan \
            -var-file="environments/staging.tfvars" \
            -var="container_image=${{ env.IMAGE_URI }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Verify Cloud Run Service
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format="value(status.url)")

          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Cloud Run service URL could not be resolved."
            exit 1
          fi

          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "Mizaniya AI Staging URL: $SERVICE_URL"

      - name: Verify Health Probe
        run: |
          curl \
            --fail \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ env.SERVICE_URL }}/health"

      - name: Verify Readiness Probe
        run: |
          curl \
            --fail \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ env.SERVICE_URL }}/ready"

      - name: Deployment Summary
        run: |
          echo "=============================================="
          echo "MIZANIYA AI STAGING DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo "Project: ${{ env.GCP_PROJECT_ID }}"
          echo "Region: ${{ env.GCP_REGION }}"
          echo "Cloud Run Service: ${{ env.CLOUD_RUN_SERVICE }}"
          echo "Application URL: ${{ env.SERVICE_URL }}"
          echo "Docker Image: ${{ env.IMAGE_URI }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "=============================================="
