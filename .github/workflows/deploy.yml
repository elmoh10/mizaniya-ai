name: Mizaniya AI Production CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build & Test (PR Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Linting
        run: npm run lint

      - name: Execute Vitest Test Suite
        run: npm run test

      - name: Verify Production Frontend Build
        env:
          VITE_FIREBASE_API_KEY: "dummy_build_api_key_for_ci"
          VITE_FIREBASE_PROJECT_ID: "mizaniya-ai-egypt-staging"
          VITE_FIREBASE_AUTH_DOMAIN: "mizaniya-ai-egypt-staging.firebaseapp.com"
          VITE_FIREBASE_STORAGE_BUCKET: "mizaniya-ai-egypt-staging.firebasestorage.app"
          VITE_FIREBASE_APP_ID: "1:123456789:web:abcdef12345"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
        run: npm run build

      - name: Verify Dockerfile Build
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="dummy_build_api_key_for_ci" \
            --build-arg VITE_FIREBASE_PROJECT_ID="mizaniya-ai-egypt-staging" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="mizaniya-ai-egypt-staging.firebaseapp.com" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="mizaniya-ai-egypt-staging.firebasestorage.app" \
            --build-arg VITE_FIREBASE_APP_ID="1:123456789:web:abcdef12345" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="123456789" \
            -t mizaniya-app:test .

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging

    env:
      GCP_PROJECT_ID: mizaniya-ai-egypt-staging
      GCP_REGION: europe-west3
      ARTIFACT_REPO: mizaniya-repo
      IMAGE_NAME: mizaniya-app
      CLOUD_RUN_SERVICE: mizaniya-app-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK & Docker Credentials
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry Repository Exists
        run: |
          gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} || \
          gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --description="Docker container repository for Mizaniya AI Application"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Immutable Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest"
          
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.STAGING_VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ env.GCP_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ env.GCP_PROJECT_ID }}.firebaseapp.com" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ env.GCP_PROJECT_ID }}.firebasestorage.app" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.STAGING_VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            -t "$IMAGE_URI" -t "$IMAGE_LATEST" .

          docker push "$IMAGE_URI"
          docker push "$IMAGE_LATEST"

      - name: Verify Secret Manager Gemini API Key Version
        run: |
          ENABLED_VERSIONS=$(gcloud secrets versions list gemini-api-key \
            --project=${{ env.GCP_PROJECT_ID }} \
            --filter="STATE=ENABLED" \
            --format="value(name)" || true)
          if [ -z "$ENABLED_VERSIONS" ]; then
            echo "::error::CRITICAL DEPLOYMENT BLOCKER: Secret 'gemini-api-key' has no enabled versions in GCP project '${{ env.GCP_PROJECT_ID }}'."
            echo "Please run the one-time secure secret version bootstrap command:"
            echo "  printf '%s' \"\$GEMINI_API_KEY\" | gcloud secrets versions add gemini-api-key --data-file=- --project=${{ env.GCP_PROJECT_ID }}"
            exit 1
          fi
          echo "Verified enabled secret version exists for gemini-api-key."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init (Staging GCS Remote Backend)
        run: |
          cd infrastructure/terraform
          terraform init \
            -backend-config="bucket=${{ env.GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=staging"

      - name: Terraform Validate
        run: |
          cd infrastructure/terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          terraform plan \
            -var-file="environments/staging.tfvars" \
            -var="container_image=$IMAGE_URI" \
            -out=tfplan

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan

      - name: Verify Service Health & Readiness Probes
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} --format 'value(status.url)')
          echo "Deployed Staging Cloud Run URL: $SERVICE_URL"
          curl -f "$SERVICE_URL/health" || exit 1
          curl -f "$SERVICE_URL/ready" || exit 1
